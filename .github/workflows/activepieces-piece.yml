name: Release Activepieces piece

# Publishes @privatus-analytics/piece-privatus-analytics to npm. The piece only
# builds inside the Activepieces monorepo, so this checks out our fork
# (Privatus-Analytics/activepieces) at the given branch, builds the piece,
# bundles it with Activepieces' own publish code, adds the README and LICENSE,
# and publishes. Source: https://github.com/Privatus-Analytics/activepieces-piece
# Bump the version in the piece's package.json on the fork branch first.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of Privatus-Analytics/activepieces to publish from
        default: npm-privatus-analytics-piece

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Privatus-Analytics/activepieces
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --ignore-scripts
      - run: npx turbo run build --filter=@privatus-analytics/piece-privatus-analytics
      - name: Bundle the piece
        run: |
          cat > tools/scripts/pieces/_prepare-privatus.ts <<'EOF'
          import { preparePieceDistForPublish } from '../../../packages/cli/src/lib/utils/prepare-piece-utils'
          preparePieceDistForPublish(process.argv[2]).catch((e) => { console.error(e); process.exit(1) })
          EOF
          npx ts-node -r tsconfig-paths/register --project tools/tsconfig.tools.json \
            tools/scripts/pieces/_prepare-privatus.ts "$PWD/packages/pieces/community/privatus-analytics"
      - name: Check and publish
        working-directory: packages/pieces/community/privatus-analytics/dist
        run: |
          cp ../README.md README.md
          curl -fsSL https://raw.githubusercontent.com/Privatus-Analytics/activepieces-piece/main/LICENSE -o LICENSE
          node -e "const p=require('./src/index.js').privatusAnalytics; if (!p || p.displayName !== 'Privatus Analytics') process.exit(1)"
          node -e "const d=require('./package.json').dependencies||{}; const bad=Object.keys(d).filter(k=>k.startsWith('@activepieces/')||String(d[k]).startsWith('workspace:')); if (bad.length) { console.error('Unbundled dependencies: '+bad); process.exit(1) }"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
