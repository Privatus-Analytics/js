<script type="text/javascript">
  RED.nodes.registerType('privatus-breakdown', {
    category: 'Privatus Analytics',
    color: '#C7E9C0',
    defaults: { name: { value: '' }, server: { value: '', type: 'privatus-config', required: true }, site: { value: '', validate: function (v) { return !v || /^pa_[A-Za-z0-9]+$/.test(v) } }, period: { value: '7d' }, from: { value: '' }, to: { value: '' }, compare: { value: 'none' }, dimension: { value: 'page' }, limit: { value: 10, validate: RED.validators.number(true) }, },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-list-ol',
    paletteLabel: 'privatus breakdown',
    label: function () {
      return this.name || 'privatus breakdown'
    },
    oneditprepare: function () {
      $('#node-input-period').on('change', function () {
        $('.privatus-custom-dates').toggle($(this).val() === 'custom')
      }).trigger('change')
    },
  })
</script>

<script type="text/html" data-template-name="privatus-breakdown">
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-key"></i> Account</label>
    <input type="text" id="node-input-server" />
  </div>
  <div class="form-row">
    <label for="node-input-site"><i class="fa fa-globe"></i> Site id</label>
    <input type="text" id="node-input-site" placeholder="pa_XXXXXXXXXX" />
  </div>
  <div class="form-row">
    <label for="node-input-period"><i class="fa fa-calendar"></i> Period</label>
    <select id="node-input-period">
      <option value="today">Today</option>
      <option value="yesterday">Yesterday</option>
      <option value="24h">Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="14d">Last 14 days</option>
      <option value="28d">Last 28 days</option>
      <option value="30d">Last 30 days</option>
      <option value="90d">Last 90 days</option>
      <option value="mtd">Month to date</option>
      <option value="last_month">Last month</option>
      <option value="qtd">Quarter to date</option>
      <option value="last_quarter">Last quarter</option>
      <option value="ytd">Year to date</option>
      <option value="12mo">Last 12 months</option>
      <option value="last_year">Last year</option>
      <option value="all">All time</option>
      <option value="custom">Custom dates</option>
    </select>
  </div>
  <div class="form-row privatus-custom-dates">
    <label for="node-input-from">From</label>
    <input type="text" id="node-input-from" placeholder="2026-10-01" style="width: 120px" />
    <label for="node-input-to" style="width: auto; margin-left: 10px">To</label>
    <input type="text" id="node-input-to" placeholder="2026-10-31" style="width: 120px" />
  </div>
  <div class="form-row">
    <label for="node-input-compare"><i class="fa fa-exchange"></i> Compare</label>
    <select id="node-input-compare">
      <option value="none">No comparison</option>
      <option value="previous_period">Previous period</option>
      <option value="previous_year">Same dates last year</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-dimension"><i class="fa fa-list-ol"></i> Top</label>
    <select id="node-input-dimension">
      <option value="page">Pages</option>
      <option value="entry_page">Entry pages</option>
      <option value="exit_page">Exit pages</option>
      <option value="channel">Channels</option>
      <option value="referrer">Sources (referrers)</option>
      <option value="utm_source">UTM source</option>
      <option value="utm_medium">UTM medium</option>
      <option value="utm_campaign">UTM campaign</option>
      <option value="country">Countries</option>
      <option value="language">Languages</option>
      <option value="device">Devices</option>
      <option value="browser">Browsers</option>
      <option value="os">Operating systems</option>
      <option value="event">Events</option>
      <option value="goal">Goals</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-limit"><i class="fa fa-sort-numeric-asc"></i> Rows</label>
    <input type="text" id="node-input-limit" placeholder="10" style="width: 80px" />
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" />
  </div>
</script>

<script type="text/html" data-help-name="privatus-breakdown">
  <p>Gets the top pages, sources, countries or another dimension of a site for a period, most important first.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt class="optional">site <span class="property-type">string</span></dt>
    <dd>A site id such as <code>pa_7Q2K9XH3AB</code>. It replaces the site id set in the node.</dd>
    <dt class="optional">dimension <span class="property-type">string</span></dt>
    <dd>Replaces the dimension set in the node, for example <code>page</code>, <code>referrer</code>, <code>country</code> or <code>prop:plan</code>.</dd>
    <dt class="optional">limit <span class="property-type">number</span></dt>
    <dd>How many rows, 1 to 1000. The default is 10.</dd>
    <dt class="optional">period <span class="property-type">string</span></dt>
    <dd>One of <code>today</code>, <code>yesterday</code>, <code>24h</code>, <code>7d</code>, <code>14d</code>, <code>28d</code>, <code>30d</code>,
      <code>90d</code>, <code>mtd</code>, <code>last_month</code>, <code>qtd</code>, <code>last_quarter</code>, <code>ytd</code>, <code>12mo</code>,
      <code>last_year</code>, <code>all</code> or <code>custom</code>.</dd>
    <dt class="optional">from, to <span class="property-type">string</span></dt>
    <dd>Dates like <code>2026-10-01</code>, used when the period is <code>custom</code>.</dd>
    <dt class="optional">compare <span class="property-type">string</span></dt>
    <dd><code>previous_period</code> or <code>previous_year</code> adds the same numbers for the earlier range and the change in percent.</dd>
    <dt class="optional">filters <span class="property-type">array</span></dt>
    <dd>Only count matching visits, for example <code>[["country","is","US"],["page","starts_with","/blog"]]</code>.</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>rows</code> is the list. Every row has <code>value</code> (the page, source or country) and <code>share</code> (percent of the total).
      Pages have <code>pageviews</code> and <code>visits</code>. Sources and countries have <code>visitors</code>, <code>visits</code> and more.
      <code>has_more</code> says if there are more rows.</dd>
  </dl>
  <p>If the call fails, the node reports an error you can catch with a Catch node. <code>msg.statusCode</code> has the HTTP status.</p>
</script>
